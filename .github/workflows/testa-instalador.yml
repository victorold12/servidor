name: Testa o instalar-tudo.bat num Windows real

# Existe porque eu (Claude) não tenho Windows pra executar .bat: conferia chaves,
# escapes e correspondência de sub-rotinas no olho, publicava, e o Victor
# descobria na mão dele o que só um Windows revela. Duas vezes seguidas. Um
# runner windows-latest é exatamente a máquina que faltava.
#
# O que ele NÃO prova: que o resultado toca voz. Prova que o script roda até o
# fim, que cada etapa reporta a verdade, e que a árvore de pastas sai certa.
on:
  workflow_dispatch:
    inputs:
      modelo_whisper:
        description: "Modelo do whisper (base ~150 MB; large-v3 ~3,1 GB e demora muito)"
        type: choice
        options: [base, tiny, small, large-v3]
        default: base
      pular_vozes:
        description: "Pular Chatterbox e Kokoro (o pip do torch é o passo mais lento)"
        type: boolean
        default: false
      # Antes isto era `main`, cravado. Consequência: o único jeito de saber se
      # uma mudança no instalador sobrevive a um Windows real era MERGEAR e
      # torcer — exatamente o contrário do que este workflow existe pra fazer.
      # Os dois repositórios usam o mesmo nome de branch nas mudanças que
      # atravessam os dois, então um campo só serve pros dois checkouts.
      ref:
        description: "Branch a testar (nos DOIS repositórios)"
        type: string
        default: main

jobs:
  testa:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout VTz-painel
        uses: actions/checkout@v5
        with:
          repository: victorold12/VTz-painel
          ref: ${{ inputs.ref }}
          path: VTz-painel

      # O servidor entra porque é onde mora o que o APP roda: o
      # electron-shell assa os .bat no build, e a conferência abaixo é o que
      # garante que o assado e o testado são o mesmo arquivo.
      - name: Checkout servidor
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          path: servidor

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Gerado pelo MESMO código do botão do painel. Testar uma cópia à parte
      # não valeria nada: divergiriam, e o testado deixaria de ser o baixado.
      - name: Gera o .bat pelo gerador do painel
        working-directory: VTz-painel
        run: node scripts/gera-instalador.mjs ${{ inputs.modelo_whisper }} instalar-tudo.bat

      - name: Como o .bat ficou
        working-directory: VTz-painel
        shell: bash
        run: |
          echo "linhas: $(wc -l < instalar-tudo.bat)"
          echo "--- sub-rotinas e chamadas ---"
          grep -E "^:|^call :|^  call :" instalar-tudo.bat || true

      # ===================================================================
      # O botão "Instalar tudo" agora roda o .bat POR DENTRO do app, sem
      # download. O que ele roda não é gerado na hora: é assado no build pelo
      # prepare-webapp, justamente pra o processo principal nunca receber
      # texto de script vindo do renderer.
      #
      # Isso cria uma pergunta nova, e é a que este passo responde: o arquivo
      # que o APP executa é o mesmo que este workflow testa? Se os dois
      # puderem divergir, o teste num Windows real deixa de valer pro caminho
      # que o usuário usa — que é agora o caminho principal.
      # ===================================================================
      - name: Assa os instaladores como o app faz
        working-directory: servidor/electron-shell
        run: node scripts/prepare-webapp.js

      - name: O .bat que o app roda é o mesmo que este workflow testa?
        shell: bash
        run: |
          ASSADO="servidor/electron-shell/webapp/instaladores/instalar-tudo-${{ inputs.modelo_whisper }}.bat"
          if ! cmp -s "VTz-painel/instalar-tudo.bat" "$ASSADO"; then
            echo "::error::O instalador assado no app difere do gerado pelo painel."
            diff <(cat VTz-painel/instalar-tudo.bat) <(cat "$ASSADO") | head -40 || true
            exit 1
          fi
          echo "byte a byte igual — testar um testa o outro"

      # Roda O ASSADO, não a cópia do painel. São idênticos (o passo acima
      # acabou de provar), e usar o do app tira qualquer dúvida sobre qual dos
      # dois foi de fato executado num Windows.
      - name: Testes do electron-shell
        working-directory: servidor/electron-shell
        run: npm test

      - name: O que a máquina já tem antes de rodar
        shell: cmd
        run: |
          echo --- estado inicial do runner ---
          where winget && winget --version || echo winget: AUSENTE
          where git && git --version || echo git: AUSENTE
          py -3.12 --version || echo py -3.12: AUSENTE
          where ffmpeg || echo ffmpeg: AUSENTE
          exit /b 0

      - name: RODA o instalador (o mesmo arquivo que o app executa)
        working-directory: servidor/electron-shell/webapp/instaladores
        shell: cmd
        env:
          JARVIS_SEM_PAUSA: "1"
          JARVIS_PULAR_VOZES: ${{ inputs.pular_vozes && '1' || '' }}
        # `exit /b 0`: o objetivo é LER o relatório do script, não passar/falhar
        # no código de saída. Um item faltando é resultado, não erro do teste —
        # o passo de veredito abaixo é quem decide.
        run: |
          call instalar-tudo-${{ inputs.modelo_whisper }}.bat
          exit /b 0

      # A raiz virou fixa (Documentos\VTz LLM) e nao mais "ao lado do .bat" —
      # justamente pra ninguem precisar adivinhar onde foi parar. O caminho sai
      # do registro, entao aqui a gente pergunta do mesmo jeito que o script.
      - name: Onde o instalador colocou as coisas
        shell: cmd
        run: |
          for /f "usebackq tokens=2,*" %%A in (`reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Shell Folders" /v Personal 2^>nul`) do set "DOCS=%%B"
          if not defined DOCS set "DOCS=%USERPROFILE%\Documents"
          echo Documentos = %DOCS%
          if exist "%DOCS%\VTz LLM" ( dir /s /b "%DOCS%\VTz LLM" | findstr /v "\\.venv\\ \\.git\\" ) else ( echo PASTA "VTz LLM" NAO FOI CRIADA )
          echo.
          echo --- resumo do proprio script ---
          if exist "%DOCS%\VTz LLM\resumo-da-instalacao.txt" ( type "%DOCS%\VTz LLM\resumo-da-instalacao.txt" ) else ( echo sem resumo )
          echo.
          echo --- pasta de inicializacao ---
          dir "%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup" 2>nul
          exit /b 0

      - name: Depois de rodar, a maquina enxerga o que foi instalado?
        shell: cmd
        run: |
          where git && git --version || echo git: AINDA AUSENTE
          py -3.12 --version || echo py -3.12: AINDA AUSENTE
          where ffmpeg || echo ffmpeg: AINDA AUSENTE
          exit /b 0

      # ===================================================================
      # O CRITÉRIO DE PRONTO: o servidor RESPONDENDO NA PORTA.
      #
      # Até aqui este workflow provava que o script roda até o fim e cria as
      # pastas certas. Nunca ligou os servidores — e foi exatamente essa lacuna
      # que deixou passar duas entregas quebradas: na primeira execução numa
      # máquina real, os dois motores morreram em segundos (um com o torch
      # corrompido por um pip interrompido, outro com o venv vazio porque o
      # projeto usa pyproject.toml e o script só sabia ler requirements.txt).
      # Nada disso apareceria conferindo pastas.
      #
      # Roda pelo módulo do app, não por um spawn próprio: assim o que se prova
      # é que o caminho do BOTÃO funciona, não que existe algum jeito de ligar.
      #
      # SEM `continue-on-error`. A primeira versão tinha, "pra não esconder o
      # relatório de pastas" — e o resultado foi o job inteiro ficar VERDE com o
      # Kokoro reprovado e o Chatterbox atendendo com o modelo morto. Criar o
      # passo certo e desarmá-lo na mesma linha é pior que não tê-lo: dá a
      # impressão de cobertura que não existe. O relatório de pastas roda antes;
      # não há nada pra proteger aqui.
      - name: Os motores sobem e ficam prontos?
        if: ${{ !inputs.pular_vozes }}
        working-directory: servidor/electron-shell
        run: node scripts/sobe-vozes.js 420

      # Só quando algo quebrou, e com saída curta: é o que transforma "falhou"
      # em "falhou POR ISTO", sem precisar minerar um log de 20 mil linhas de
      # pip. Existe porque a causa do Chatterbox (o `perth` que o __init__
      # engole) é invisível de fora — o sintoma é um TypeError sem relação
      # aparente com marca-d'água.
      - name: Por que não ficou pronto (diagnóstico)
        if: ${{ failure() && !inputs.pular_vozes }}
        working-directory: servidor/electron-shell
        run: node scripts/diagnostico-vozes.js

      - name: Veredito
        shell: bash
        run: |
          falhou=0
          RAIZ="$USERPROFILE/Documents/VTz LLM"
          echo "conferindo em: $RAIZ"
          for d in "vozes" "whisper/programa" "whisper/modelos"; do
            if [ -d "$RAIZ/$d" ]; then echo "ok    $d"; else echo "FALTA $d"; falhou=1; fi
          done
          # ligar-vozes.bat e o atalho sao a novidade desta versao: sem eles a
          # pessoa volta a ter que decorar caminho de venv, que foi o problema.
          for f in "LEIA-ME.txt" "resumo-da-instalacao.txt" "ligar-vozes.bat"; do
            if [ -s "$RAIZ/$f" ]; then echo "ok    $f"; else echo "FALTA $f"; falhou=1; fi
          done
          LNK="$APPDATA/Microsoft/Windows/Start Menu/Programs/Startup/JARVIS - vozes.lnk"
          if [ -f "$LNK" ]; then echo "ok    atalho de inicializacao"; else echo "FALTA atalho de inicializacao"; falhou=1; fi
          if ls "$RAIZ/whisper/modelos/"*.bin >/dev/null 2>&1; then
            echo "ok    modelo:"; ls -la "$RAIZ/whisper/modelos/"
          else echo "FALTA modelo do whisper"; falhou=1; fi
          if [ -f "$RAIZ/whisper/programa/whisper-cli.exe" ]; then echo "ok    whisper-cli.exe"; else echo "FALTA whisper-cli.exe"; falhou=1; fi
          exit $falhou

      - name: Guarda o .bat testado
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: instalar-tudo-testado
          path: servidor/electron-shell/webapp/instaladores/instalar-tudo-${{ inputs.modelo_whisper }}.bat
          if-no-files-found: warn
