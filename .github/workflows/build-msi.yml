name: Build JARVIS .msi

# Manual de propósito: build em windows-latest custa minutos de CI de verdade,
# e não faz sentido rodar em todo push. Aciona em Actions > Build JARVIS .msi
# > Run workflow. (Pode trocar pra `push:` depois se quiser build automático.)
on:
  workflow_dispatch:
    inputs:
      repetir_versao:
        description: "Buildar mesmo que esta versão já tenha saído (rebuild proposital)"
        type: boolean
        default: false

jobs:
  build-msi:
    runs-on: windows-latest
    # Pra cravar a tag da versão no fim, quando o build dá certo.
    permissions:
      contents: write
    steps:
      - name: Checkout servidor
        uses: actions/checkout@v5
        with:
          path: servidor
          # A trava de versão compara com as tags; sem isto o checkout raso não
          # traz nenhuma e ela nunca acusaria nada.
          fetch-depth: 0

      # TRAVA DE VERSÃO — primeira coisa depois do checkout, de propósito: falha
      # em segundos, antes de gastar os minutos de Windows.
      #
      # Por que existe: já saiu instalador com número errado duas vezes. Um
      # 0.6.0 que devia ter subido, e um 0.7.0 repetido — e repetir é o pior dos
      # dois, porque o Windows decide se atualiza pela versão: 0.7.0 por cima de
      # 0.7.0 pode não fazer nada, e quem tinha o quebrado continua com ele
      # achando que atualizou. Quem percebeu as duas vezes foi o Victor, olhando
      # a tela. Isso é trabalho de máquina.
      #
      # A marca é uma tag `msi-vX.Y.Z`, cravada só no FIM, quando o build deu
      # certo — build que falhou não gasta o número, e tentar de novo funciona.
      - name: Esta versão já saiu antes?
        id: versao
        working-directory: servidor
        shell: bash
        run: |
          v=$(grep -m1 '"version"' electron-shell/package.json | sed -E 's/.*"version"[^"]*"([^"]+)".*/\1/')
          if [ -z "$v" ]; then echo "::error::não achei a versão em electron-shell/package.json"; exit 1; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "versão deste build: $v"
          if git rev-parse -q --verify "refs/tags/msi-v$v" >/dev/null; then
            if [ "${{ inputs.repetir_versao }}" = "true" ]; then
              echo "::warning::$v já saiu antes — seguindo porque você marcou rebuild proposital."
            else
              echo "::error::A versão $v JÁ FOI PUBLICADA (tag msi-v$v). Instalar $v por cima de $v pode não atualizar nada no Windows. Suba o número em electron-shell/package.json, ou rode de novo marcando 'Buildar mesmo que esta versão já tenha saído' se o rebuild for proposital."
              exit 1
            fi
          fi

      - name: Checkout VTz-painel
        uses: actions/checkout@v5
        with:
          repository: victorold12/VTz-painel
          # `main`: é o painel PUBLICADO, o mesmo que o site serve. Ficou preso
          # num branch de desenvolvimento e ninguém percebeu — o branch parou 16
          # commits atrás quando o trabalho foi pro main, e o .msi passou a
          # empacotar um painel velho enquanto o site já estava novo. O sintoma
          # foi cruel: o app abria, funcionava, e só faltavam coisas.
          ref: main
          path: VTz-painel

      # Deixa NO LOG de qual painel este instalador é feito. Quando faltar uma
      # tela no app instalado, esta linha responde "o .msi é velho?" em um olhar,
      # em vez de caçar a diferença pela interface.
      - name: Qual painel entrou neste instalador
        working-directory: VTz-painel
        shell: bash
        run: git log -1 --format='painel %h de %ad %n%s' --date=short

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # >=22: o Agente Local usa o WebSocket global nativo do Node, que só
          # é garantido a partir daqui (rodar com 20 quebra createAgentConnection
          # com "WebSocket is not defined" — já bateu nisso uma vez de verdade).
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # --- Web App (repo irmão) ---
      - name: Instala deps da Web App
        working-directory: VTz-painel
        run: npm install

      - name: Builda a Web App (app.js/style.css)
        working-directory: VTz-painel
        run: npm run build

      # --- Agente Local: instala, testa antes de empacotar ---
      - name: Instala deps do Agente Local
        working-directory: servidor/agente-local
        run: npm install

      - name: Instala deps Python do backend (pros testes de integração)
        working-directory: servidor
        run: pip install -r requirements.txt

      - name: Roda os testes do Agente Local
        working-directory: servidor/agente-local
        run: npm test

      # O backend não vai dentro do .msi, mas o Agente Local conversa com ele:
      # se o contrato quebrar, o instalador sai com um app que não funciona.
      # Rodar aqui é barato (os testes não usam rede) e evita empacotar isso.
      - name: Roda os testes do backend
        working-directory: servidor
        shell: bash
        env:
          # O runner do Windows entrega stdout em cp1252, e vários testes
          # imprimem "✓"/"≠" — sem isto eles PASSAM e ainda assim quebram o
          # build com UnicodeEncodeError na hora de escrever o resultado.
          PYTHONIOENCODING: utf-8
        run: |
          falhou=0
          for t in tests/test_*.py; do
            echo "--- $t"
            python "$t" || falhou=1
          done
          exit $falhou

      # --- Electron shell: empacota ---
      - name: Instala deps do Electron shell
        working-directory: servidor/electron-shell
        run: npm install

      - name: Builda o .msi (JARVIS Completo)
        working-directory: servidor/electron-shell
        run: npm run dist:win

      - name: Sobe o .msi (Completo) como artifact
        uses: actions/upload-artifact@v6
        with:
          name: jarvis-installer
          path: servidor/electron-shell/dist/*.msi
          if-no-files-found: error

      # Segundo instalador (Seção 10): só o Agente Local, sem a Web App
      # embutida — não depende do checkout do VTz-painel nem do build dele.
      - name: Builda o .msi (JARVIS Agente Local)
        working-directory: servidor/electron-shell
        run: npm run dist:win:agent-only

      - name: Sobe o .msi (Agente Local) como artifact
        uses: actions/upload-artifact@v6
        with:
          name: jarvis-agente-local-installer
          path: servidor/electron-shell/dist-agent-only/*.msi
          if-no-files-found: error

      # Só aqui, no fim: o número está gasto quando existe instalador de verdade
      # com ele. Se algo acima falhou, a tag não sai e tentar de novo funciona.
      - name: Marca a versão como publicada
        working-directory: servidor
        shell: bash
        run: |
          v='${{ steps.versao.outputs.v }}'
          if git rev-parse -q --verify "refs/tags/msi-v$v" >/dev/null; then
            echo "msi-v$v já existe (rebuild proposital) — mantendo a marca original."
          else
            git tag "msi-v$v"
            git push origin "msi-v$v"
            echo "marcado: msi-v$v"
          fi
