# Blueprint do Render — deixa o deploy quase automático.
# No Render: New > Blueprint > aponta pro repo, ele lê isto.
services:
  - type: web
    name: vtz-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Python fixo pra evitar o problema do 3.14 com pydantic
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Domínios que podem chamar este backend pelo navegador. Já vem apontado
      # pro painel publicado pelo render.yaml do repo VTz-painel, mais o
      # localhost de desenvolvimento.
      #
      # Se o Render der outro nome ao site (acontece quando "vtz-painel" já
      # existe na conta), ajuste aqui — senão o painel mostra "falha de rede"
      # sem dizer que quem barrou foi o CORS. O log do backend imprime as
      # origens válidas no boot.
      - key: ALLOWED_ORIGINS
        value: "https://vtz-painel.onrender.com,http://localhost:8000,http://127.0.0.1:8000"
      # Token de acesso — OBRIGATÓRIO. O backend se recusa a subir sem ele
      # quando roda no Render (app/main.py), porque um backend aberto com a
      # chave do OpenRouter dentro é a conta de outra pessoa gastando a sua.
      # Environment > Add > BACKEND_TOKEN = valor longo e aleatório. Cole o
      # mesmo valor no painel, em Config > Backend VTz OS > Token de acesso.
      - key: BACKEND_TOKEN
        sync: false
      # Snapshot do banco (conversas + memória) a cada 6 horas, guardando os 14
      # últimos. Custa alguns KB e roda dentro do processo — sem serviço extra.
      #
      # LEIA ISTO ANTES DE CONFIAR NELE: no plano free o snapshot cai no MESMO
      # disco efêmero do banco. Isso protege contra corromper o arquivo ou
      # apagar sem querer — NÃO protege contra o container ser recriado, que é o
      # que acontece a cada deploy e a cada vez que o serviço acorda de
      # hibernar. Nesse caso banco e snapshots somem juntos.
      #
      # O que realmente segura os dados no plano free: (1) manter o serviço
      # acordado, veja "Não deixar o servidor hibernar" no README; (2) baixar o
      # backup de vez em quando (painel > Config > Dados). Persistência de
      # verdade só com disco, que é plano pago — o bloco comentado mais abaixo.
      - key: BACKUP_EVERY_HOURS
        value: "6"
      - key: BACKUP_KEEP
        value: "14"
    # ONDE O BANCO VIVE
    #
    # Do jeito que está: dentro do container. E o container do Render é recriado
    # a cada deploy e a cada vez que o plano free acorda de hibernar — conversa,
    # memória e pareamento somem sozinhos. É o preço do plano free, e o backup
    # automático (BACKUP_EVERY_HOURS) existe justamente por causa disso.
    #
    # Pra manter os dados: assine o plano starter e DESCOMENTE OS QUATRO blocos
    # abaixo de uma vez — disco, plano e as duas variáveis. Eles funcionam como
    # conjunto: as variáveis sozinhas apontam pra um /var/data que não existe, e
    # o processo não pode criar (a pasta é do root). Já foi assim, e o deploy
    # morria com "PermissionError: Permission denied: '/var/data'".
    #
    # Hoje o backend não morre mais nesse caso — cai pro caminho de dentro do
    # container e avisa no log. Mas o certo é não pedir um disco que não existe.
    #
    #   plan: starter                    ← troque `plan: free` lá em cima
    #   disk:
    #     name: vtz-dados
    #     mountPath: /var/data
    #     sizeGB: 1
    #   envVars (junto dos de cima):
    #     - key: JARVIS_DB_PATH
    #       value: /var/data/jarvis.db
    #     - key: BACKUP_DIR
    #       value: /var/data/backups
      # Opcional: chaves dos conectores como variaveis (persistem entre restarts).
      # Se preferir, deixe em branco e configure pelo site (aba Conectores).
      # - key: NOTION_TOKEN
      #   sync: false
      # - key: FIGMA_TOKEN
      #   sync: false
