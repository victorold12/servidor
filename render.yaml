# Blueprint do Render — deixa o deploy quase automático.
# No Render: New > Blueprint > aponta pro repo, ele lê isto.
services:
  - type: web
    name: vtz-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Python fixo pra evitar o problema do 3.14 com pydantic
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Domínios que podem chamar este backend pelo navegador. Já vem apontado
      # pro painel publicado pelo render.yaml do repo VTz-painel, mais o
      # localhost de desenvolvimento.
      #
      # Se o Render der outro nome ao site (acontece quando "vtz-painel" já
      # existe na conta), ajuste aqui — senão o painel mostra "falha de rede"
      # sem dizer que quem barrou foi o CORS. O log do backend imprime as
      # origens válidas no boot.
      - key: ALLOWED_ORIGINS
        value: "https://vtz-painel.onrender.com,http://localhost:8000,http://127.0.0.1:8000"
      # Token de acesso — OBRIGATÓRIO. O backend se recusa a subir sem ele
      # quando roda no Render (app/main.py), porque um backend aberto com a
      # chave do OpenRouter dentro é a conta de outra pessoa gastando a sua.
      # Environment > Add > BACKEND_TOKEN = valor longo e aleatório. Cole o
      # mesmo valor no painel, em Config > Backend VTz OS > Token de acesso.
      - key: BACKEND_TOKEN
        sync: false
      # ONDE O BANCO VIVE. Sem isto o SQLite fica dentro do container, e o
      # container do Render é recriado a cada deploy e a cada vez que o plano
      # free acorda de hibernar — ou seja, conversa, memória e pareamento
      # somem sozinhos. Apontar pro disco só resolve junto do bloco `disk`
      # abaixo, que exige plano pago (o free não aceita disco).
      - key: JARVIS_DB_PATH
        value: /var/data/jarvis.db
      # Snapshots do backup automático no mesmo disco.
      - key: BACKUP_DIR
        value: /var/data/backups
    # Descomente junto com plan: starter (US$7/mês). É o que faz os dados
    # sobreviverem ao restart. No plano free, deixe comentado E apague as duas
    # variáveis acima — sem disco, /var/data não existe e o backend não sobe.
    # disk:
    #   name: vtz-dados
    #   mountPath: /var/data
    #   sizeGB: 1
      # Opcional: chaves dos conectores como variaveis (persistem entre restarts).
      # Se preferir, deixe em branco e configure pelo site (aba Conectores).
      # - key: NOTION_TOKEN
      #   sync: false
      # - key: FIGMA_TOKEN
      #   sync: false
